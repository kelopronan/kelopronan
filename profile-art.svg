<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Words, in motion</title>
  <desc id="desc">A minimal caption preview in Gradian's deep green, mint, and warm cream colors.</desc>
  <defs>
    <linearGradient id="surface" x1="20" y1="10" x2="880" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111817"/>
      <stop offset="1" stop-color="#151615"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A1E9D7"/>
      <stop offset="1" stop-color="#74D1B8"/>
    </linearGradient>
  </defs>

  <rect x=".5" y=".5" width="899" height="189" rx="18" fill="url(#surface)" stroke="#EAF4EF" stroke-opacity=".11"/>

  <circle cx="39" cy="43" r="4" fill="#E9B18F"/>
  <text x="52" y="47" fill="#9BA9A3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.5">DEVANSH  /  GRADIAN</text>

  <text x="38" y="105" fill="#F3F1EC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="35" font-weight="600" letter-spacing="-1.3">Words, in <tspan fill="url(#mint)">motion.</tspan></text>
  <text x="40" y="135" fill="#AEB8B3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Building thoughtful creative tools.</text>

  <path d="M447 32v126" stroke="#EAF4EF" stroke-opacity=".1"/>

  <rect x="482.5" y="38.5" width="374" height="91" rx="13" fill="#0E1211" stroke="#EAF4EF" stroke-opacity=".12"/>
  <text x="501" y="61" fill="#899892" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.2">CAPTION PREVIEW</text>
  <text x="502" y="98" fill="#F3F1EC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="-.55">Make every</text>
  <rect x="637" y="75" width="67" height="31" rx="7" fill="#79D9C0" fill-opacity=".16"/>
  <text x="644" y="98" fill="url(#mint)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" letter-spacing="-.55">word</text>
  <text x="712" y="98" fill="#F3F1EC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="-.55">land.</text>

  <path d="M501 153h336" stroke="#48534E" stroke-width="2" stroke-linecap="round"/>
  <path d="M501 153h181" stroke="#79D9C0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="682" cy="153" r="4" fill="#E9B18F"/>
  <path d="M501 149v8m84-5v3m84-5v8m84-5v3m84-5v8" stroke="#AAB6B0" stroke-opacity=".45" stroke-width="1"/>
</svg>
